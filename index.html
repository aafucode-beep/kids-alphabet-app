<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABC Animals! - Learn Your Letters</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Bubblegum+Sans&display=swap" rel="stylesheet">
<style>
:root {
  --font-body: 'Fredoka', sans-serif;
  --font-display: 'Bubblegum Sans', cursive;
  --shadow-soft: 0 8px 24px rgba(0,0,0,0.12);
  --shadow-deep: 0 12px 36px rgba(0,0,0,0.2);
  --shadow-toy: 0 6px 0 rgba(0,0,0,0.15);
  --radius: 28px;
  --radius-sm: 18px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  font-family: var(--font-body);
  overflow-x: hidden;
  min-height: 100vh;
}

body {
  background: linear-gradient(135deg, #FFF3E0 0%, #FFE4F0 25%, #E0F7FA 50%, #F1FFE0 75%, #FFFDE7 100%);
  background-size: 400% 400%;
  animation: bgShift 20s ease-in-out infinite;
  position: relative;
  min-height: 100vh;
}

@keyframes bgShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

/* Floating background bubbles */
.bubble {
  position: fixed;
  border-radius: 50%;
  opacity: 0.35;
  pointer-events: none;
  z-index: 0;
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
  10% { opacity: 0.35; }
  90% { opacity: 0.2; }
  100% { transform: translateY(-20vh) scale(1.2); opacity: 0; }
}

/* ---- Screen System ---- */
.screen {
  display: none;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}
.screen.active {
  display: flex;
  flex-direction: column;
  animation: screenIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes screenIn {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}

/* ---- Home Screen ---- */
#home-screen {
  align-items: center;
  justify-content: center;
  padding: 2rem;
}

.home-content {
  text-align: center;
  max-width: 900px;
}

.home-title {
  font-family: var(--font-display);
  font-size: clamp(3.5rem, 12vw, 7rem);
  line-height: 1.1;
  margin-bottom: 0.3rem;
  background: linear-gradient(135deg, #FF6B6B, #FFD93D, #6BCB77, #4D96FF, #9D4EDD);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(2px 4px 0 rgba(0,0,0,0.08));
  animation: titlePop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes titlePop {
  0% { transform: scale(0) rotate(-8deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

.home-subtitle {
  font-size: clamp(1.1rem, 3vw, 1.6rem);
  color: #555;
  margin-bottom: 3rem;
  font-weight: 500;
}

.home-subtitle .parrot {
  display: inline-block;
  animation: parrotBob 1.5s ease-in-out infinite;
}

@keyframes parrotBob {
  0%, 100% { transform: translateY(0) rotate(-5deg); }
  50% { transform: translateY(-8px) rotate(5deg); }
}

.mode-buttons {
  display: flex;
  gap: 2rem;
  justify-content: center;
  flex-wrap: wrap;
}

.mode-btn {
  background: white;
  border: none;
  border-radius: var(--radius);
  padding: 2rem 2.5rem;
  width: 240px;
  cursor: pointer;
  box-shadow: var(--shadow-toy), var(--shadow-soft);
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative;
  overflow: hidden;
}

.mode-btn:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-toy), var(--shadow-deep);
}

.mode-btn:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 rgba(0,0,0,0.15), var(--shadow-soft);
}

.mode-btn .icon {
  font-size: 4rem;
  display: block;
  margin-bottom: 0.5rem;
  animation: iconBounce 2s ease-in-out infinite;
}

.mode-btn:nth-child(2) .icon { animation-delay: 0.3s; }
.mode-btn:nth-child(3) .icon { animation-delay: 0.6s; }

@keyframes iconBounce {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-10px) scale(1.05); }
}

.mode-btn .label {
  font-family: var(--font-display);
  font-size: 1.8rem;
  color: #333;
}

.mode-btn .desc {
  font-size: 0.9rem;
  color: #888;
  margin-top: 0.3rem;
}

.mode-btn.learn { border-top: 6px solid #FF6B6B; }
.mode-btn.listen { border-top: 6px solid #4D96FF; }
.mode-btn.play { border-top: 6px solid #6BCB77; }

/* ---- Top Bar ---- */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 2rem;
  z-index: 10;
}

.back-btn {
  background: white;
  border: none;
  border-radius: 50%;
  width: 56px;
  height: 56px;
  font-size: 1.5rem;
  cursor: pointer;
  box-shadow: var(--shadow-toy), var(--shadow-soft);
  transition: transform 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.back-btn:hover { transform: scale(1.1); }
.back-btn:active { transform: scale(0.95); }

.screen-title {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 5vw, 2.5rem);
  color: #333;
}

.score-badge {
  background: white;
  border-radius: 100px;
  padding: 0.5rem 1.5rem;
  font-size: 1.3rem;
  font-weight: 700;
  color: #FF6B6B;
  box-shadow: var(--shadow-toy), var(--shadow-soft);
}

/* ---- Learn Mode ---- */
#learn-screen .content-area {
  flex: 1;
  padding: 0.5rem 2rem 3rem;
}

.letter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 1.2rem;
  max-width: 1200px;
  margin: 0 auto;
}

.letter-card {
  background: white;
  border-radius: var(--radius-sm);
  padding: 1rem 0.5rem;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow-toy), var(--shadow-soft);
  transition: transform 0.2s;
  position: relative;
  overflow: hidden;
  animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}

.letter-card:nth-child(n) { animation-delay: calc(var(--i) * 0.03s); }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px) scale(0.8); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.letter-card:hover {
  transform: translateY(-8px) rotate(-2deg) scale(1.03);
}

.letter-card:active {
  transform: scale(0.95);
}

.letter-card .big-letter {
  font-family: var(--font-display);
  font-size: 3.5rem;
  line-height: 1;
  margin-bottom: 0.3rem;
}

.letter-card .animal-emoji {
  font-size: 2.5rem;
  display: block;
  margin-bottom: 0.2rem;
}

.letter-card .animal-name {
  font-size: 0.85rem;
  font-weight: 600;
  color: #666;
  text-transform: capitalize;
}

/* Detail overlay */
.detail-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 2rem;
}

.detail-overlay.show {
  display: flex;
  animation: fadeIn 0.3s;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.detail-card {
  background: white;
  border-radius: 32px;
  padding: 3rem;
  text-align: center;
  max-width: 400px;
  width: 90%;
  box-shadow: var(--shadow-deep);
  animation: detailPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}

@keyframes detailPop {
  from { transform: scale(0.5) rotate(-10deg); opacity: 0; }
  to { transform: scale(1) rotate(0); opacity: 1; }
}

.detail-card .detail-letter {
  font-family: var(--font-display);
  font-size: 8rem;
  line-height: 1;
  margin-bottom: 0.5rem;
}

.detail-card .detail-letter .lower {
  font-size: 5rem;
  opacity: 0.6;
}

.detail-card .detail-animal {
  font-size: 5rem;
  margin: 0.5rem 0;
  display: block;
}

.detail-card .detail-name {
  font-family: var(--font-display);
  font-size: 2rem;
  color: #333;
  margin-bottom: 1.5rem;
}

.detail-card .detail-phrase {
  font-size: 1.2rem;
  color: #777;
  margin-bottom: 1.5rem;
}

.speak-btn {
  background: #4D96FF;
  color: white;
  border: none;
  border-radius: 100px;
  padding: 0.8rem 2rem;
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font-body);
  box-shadow: 0 4px 0 #2980c0;
  transition: transform 0.15s;
}

.speak-btn:hover { transform: scale(1.05); }
.speak-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #2980c0; }

.close-btn {
  position: absolute;
  top: 1rem;
  right: 1rem;
  background: #f0f0f0;
  border: none;
  border-radius: 50%;
  width: 44px;
  height: 44px;
  font-size: 1.3rem;
  cursor: pointer;
  transition: transform 0.15s;
}

.close-btn:hover { transform: rotate(90deg) scale(1.1); }

/* ---- Listen Mode ---- */
#listen-screen {
  align-items: center;
  justify-content: center;
}

.listen-stage {
  text-align: center;
  max-width: 500px;
  padding: 2rem;
}

.listen-letter {
  font-family: var(--font-display);
  font-size: clamp(8rem, 30vw, 16rem);
  line-height: 1;
  margin-bottom: 1rem;
  animation: letterDance 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes letterDance {
  0% { transform: scale(0) rotate(-15deg); opacity: 0; }
  50% { transform: scale(1.15) rotate(5deg); }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

.listen-animal {
  font-size: clamp(4rem, 15vw, 8rem);
  display: block;
  margin-bottom: 1rem;
  animation: animalWiggle 0.8s ease-in-out;
}

@keyframes animalWiggle {
  0%, 100% { transform: rotate(0) scale(1); }
  25% { transform: rotate(-8deg) scale(1.05); }
  75% { transform: rotate(8deg) scale(1.05); }
}

.listen-name {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 5vw, 2.5rem);
  color: #333;
  margin-bottom: 2rem;
}

.listen-controls {
  display: flex;
  gap: 1.5rem;
  justify-content: center;
  align-items: center;
  margin-top: 1rem;
}

.listen-btn {
  background: white;
  border: none;
  border-radius: 50%;
  width: 70px;
  height: 70px;
  font-size: 1.8rem;
  cursor: pointer;
  box-shadow: var(--shadow-toy), var(--shadow-soft);
  transition: transform 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.listen-btn:hover { transform: scale(1.15); }
.listen-btn:active { transform: scale(0.92); }

.listen-btn.play-pause {
  width: 90px;
  height: 90px;
  font-size: 2.2rem;
  background: #FFD93D;
}

.listen-progress {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin-top: 2rem;
  flex-wrap: wrap;
  max-width: 600px;
}

.progress-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #ddd;
  transition: all 0.3s;
}

.progress-dot.active {
  background: #4D96FF;
  transform: scale(1.5);
}

.progress-dot.done {
  background: #6BCB77;
}

/* ---- Play Mode (Game) ---- */
#play-screen {
  align-items: center;
}

.game-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1rem 2rem 3rem;
  width: 100%;
  max-width: 700px;
}

.game-prompt {
  font-family: var(--font-display);
  font-size: clamp(1.3rem, 4vw, 2rem);
  color: #333;
  text-align: center;
  margin-bottom: 1.5rem;
}

.game-animal {
  font-size: clamp(6rem, 25vw, 10rem);
  margin-bottom: 1rem;
  animation: animalBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes animalBounce {
  0% { transform: scale(0) rotate(-20deg); opacity: 0; }
  60% { transform: scale(1.2) rotate(10deg); }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

.game-question {
  font-size: clamp(1.1rem, 3.5vw, 1.5rem);
  color: #666;
  margin-bottom: 2rem;
  text-align: center;
}

.game-options {
  display: flex;
  gap: 1.5rem;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 2rem;
}

.option-btn {
  width: 100px;
  height: 100px;
  border: none;
  border-radius: 24px;
  font-family: var(--font-display);
  font-size: 3.5rem;
  cursor: pointer;
  box-shadow: var(--shadow-toy), var(--shadow-soft);
  transition: transform 0.2s;
  background: white;
  color: #333;
}

.option-btn:hover {
  transform: translateY(-6px) rotate(-3deg);
}

.option-btn.correct {
  background: #6BCB77 !important;
  color: white !important;
  animation: correctShake 0.5s;
}

@keyframes correctShake {
  0%, 100% { transform: scale(1); }
  25% { transform: scale(1.15) rotate(-5deg); }
  75% { transform: scale(1.15) rotate(5deg); }
}

.option-btn.wrong {
  background: #FF6B6B !important;
  color: white !important;
  animation: wrongShake 0.4s;
}

@keyframes wrongShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

.option-btn:disabled {
  cursor: default;
  opacity: 0.7;
}

/* Stars celebration */
.star-celebration {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 200;
  overflow: hidden;
}

.star-particle {
  position: absolute;
  font-size: 2rem;
  animation: starFly 1s ease-out forwards;
}

@keyframes starFly {
  0% { transform: translate(0,0) scale(0) rotate(0); opacity: 1; }
  50% { transform: translate(var(--dx), var(--dy)) scale(1.5) rotate(180deg); opacity: 1; }
  100% { transform: translate(var(--dx), calc(var(--dy) + 200px)) scale(0.5) rotate(360deg); opacity: 0; }
}

.game-result {
  font-family: var(--font-display);
  font-size: 2rem;
  margin-top: 1rem;
  opacity: 0;
  transition: opacity 0.3s;
}

.game-result.show {
  opacity: 1;
  animation: resultPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes resultPop {
  from { transform: scale(0); }
  to { transform: scale(1); }
}

.next-btn {
  background: #FFD93D;
  border: none;
  border-radius: 100px;
  padding: 1rem 2.5rem;
  font-family: var(--font-display);
  font-size: 1.4rem;
  cursor: pointer;
  box-shadow: 0 5px 0 #d4a800, var(--shadow-soft);
  transition: transform 0.15s;
  margin-top: 1.5rem;
  display: none;
}

.next-btn.show { display: block; animation: resultPop 0.4s; }
.next-btn:hover { transform: scale(1.05); }
.next-btn:active { transform: translateY(2px); box-shadow: 0 3px 0 #d4a800; }

/* Game finished overlay */
.game-finished {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 150;
}

.game-finished.show {
  display: flex;
  animation: fadeIn 0.3s;
}

.finished-card {
  background: white;
  border-radius: 32px;
  padding: 3rem;
  text-align: center;
  max-width: 400px;
  box-shadow: var(--shadow-deep);
  animation: detailPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.finished-card .trophy {
  font-size: 5rem;
  display: block;
  margin-bottom: 1rem;
  animation: trophyBounce 0.6s ease-in-out;
}

@keyframes trophyBounce {
  0% { transform: scale(0) rotate(-20deg); }
  60% { transform: scale(1.3) rotate(10deg); }
  100% { transform: scale(1) rotate(0); }
}

.finished-card h2 {
  font-family: var(--font-display);
  font-size: 2.2rem;
  margin-bottom: 0.5rem;
}

.finished-card p {
  font-size: 1.2rem;
  color: #666;
  margin-bottom: 2rem;
}

.finished-card .final-score {
  font-size: 3rem;
  font-weight: 700;
  color: #FF6B6B;
  margin-bottom: 0.5rem;
}

.play-again-btn {
  background: #6BCB77;
  color: white;
  border: none;
  border-radius: 100px;
  padding: 1rem 2.5rem;
  font-family: var(--font-display);
  font-size: 1.3rem;
  cursor: pointer;
  box-shadow: 0 5px 0 #4a9a57;
  transition: transform 0.15s;
}

.play-again-btn:hover { transform: scale(1.05); }
.play-again-btn:active { transform: translateY(2px); box-shadow: 0 3px 0 #4a9a57; }

/* Responsive */
@media (max-width: 600px) {
  .mode-buttons { gap: 1rem; }
  .mode-btn { width: 100%; max-width: 320px; padding: 1.5rem; }
  .option-btn { width: 80px; height: 80px; font-size: 2.8rem; }
  .letter-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0.8rem; }
}
</style>
</head>
<body>

<!-- Floating bubbles -->
<div id="bubbles"></div>

<!-- ============ HOME SCREEN ============ -->
<div class="screen active" id="home-screen">
  <div class="home-content">
    <h1 class="home-title">ABC Animals!</h1>
    <p class="home-subtitle"><span class="parrot">🦜</span> Let's learn our letters together!</p>
    <div class="mode-buttons">
      <button class="mode-btn learn" onclick="showScreen('learn-screen')">
        <span class="icon">📖</span>
        <span class="label">Learn</span>
        <span class="desc">Tap letters to explore</span>
      </button>
      <button class="mode-btn listen" onclick="showScreen('listen-screen')">
        <span class="icon">🔊</span>
        <span class="label">Listen</span>
        <span class="desc">Hear every letter</span>
      </button>
      <button class="mode-btn play" onclick="showScreen('play-screen')">
        <span class="icon">🎮</span>
        <span class="label">Play</span>
        <span class="desc">Match letters & animals</span>
      </button>
    </div>
  </div>
</div>

<!-- ============ LEARN SCREEN ============ -->
<div class="screen" id="learn-screen">
  <div class="top-bar">
    <button class="back-btn" onclick="showScreen('home-screen')" title="Back">⬅</button>
    <span class="screen-title">📖 Learn Your Letters</span>
    <div style="width:56px"></div>
  </div>
  <div class="content-area">
    <div class="letter-grid" id="letter-grid"></div>
  </div>
</div>

<!-- Detail overlay -->
<div class="detail-overlay" id="detail-overlay" onclick="closeDetail(event)">
  <div class="detail-card" id="detail-card">
    <button class="close-btn" onclick="closeDetail()">✕</button>
    <div class="detail-letter" id="detail-letter"></div>
    <span class="detail-animal" id="detail-animal"></span>
    <div class="detail-name" id="detail-name"></div>
    <div class="detail-phrase" id="detail-phrase"></div>
    <button class="speak-btn" onclick="speakCurrent()">🔊 Hear it again!</button>
  </div>
</div>

<!-- ============ LISTEN SCREEN ============ -->
<div class="screen" id="listen-screen">
  <div class="top-bar">
    <button class="back-btn" onclick="stopListen(); showScreen('home-screen')" title="Back">⬅</button>
    <span class="screen-title">🔊 Listen & Learn</span>
    <div style="width:56px"></div>
  </div>
  <div class="listen-stage">
    <div class="listen-letter" id="listen-letter">A</div>
    <span class="listen-animal" id="listen-animal">🐊</span>
    <div class="listen-name" id="listen-name">Alligator</div>
    <div class="listen-controls">
      <button class="listen-btn" id="prev-btn" onclick="prevLetter()">⏮</button>
      <button class="listen-btn play-pause" id="play-pause-btn" onclick="toggleListen()">▶</button>
      <button class="listen-btn" id="next-btn" onclick="nextLetter()">⏭</button>
    </div>
    <div class="listen-progress" id="listen-progress"></div>
  </div>
</div>

<!-- ============ PLAY SCREEN ============ -->
<div class="screen" id="play-screen">
  <div class="top-bar">
    <button class="back-btn" onclick="endGame(); showScreen('home-screen')" title="Back">⬅</button>
    <span class="screen-title">🎮 Letter Game</span>
    <span class="score-badge">⭐ <span id="score">0</span></span>
  </div>
  <div class="game-area" id="game-area">
    <!-- Game content injected by JS -->
  </div>
</div>

<!-- Star celebration container -->
<div class="star-celebration" id="star-celebration"></div>

<!-- Game finished overlay -->
<div class="game-finished" id="game-finished">
  <div class="finished-card">
    <span class="trophy">🏆</span>
    <h2>You did it!</h2>
    <p>You matched all the letters!</p>
    <div class="final-score" id="final-score">0 / 10</div>
    <p>Great job, little learner!</p>
    <button class="play-again-btn" onclick="restartGame()">🎮 Play Again</button>
  </div>
</div>

<script>
// ===== DATA: 26 Letters with Animals =====
const ALPHABET = [
  { letter: 'A', animal: 'alligator', emoji: '🐊', color: '#FF6B6B' },

// ===== Screen Navigation =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'learn-screen') initLearn();
  if (id === 'listen-screen') initListen();
  if (id === 'play-screen') initGame();
}

// ===== Speech Synthesis =====
let voices = [];
function loadVoices() {
  voices = speechSynthesis.getVoices();
}
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text, rate = 0.85, pitch = 1.2) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = rate;
  u.pitch = pitch;
  u.volume = 1;
  // Prefer an English voice
  const enVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Female'))
    || voices.find(v => v.lang.startsWith('en'))
    || voices.find(v => v.lang);
  if (enVoice) u.voice = enVoice;
  speechSynthesis.speak(u);
}

function speakLetterAndAnimal(item) {
  speak(`${item.letter}. ${item.letter} for ${item.animal}.`, 0.8, 1.3);
}

function speakLetterSound(letter) {
  speak(letter, 0.7, 1.5);
}

// ===== Bubbles Background =====
function createBubbles() {
  const container = document.getElementById('bubbles');
  const colors = ['#FF6B6B','#FFD93D','#6BCB77','#4D96FF','#9D4EDD','#FF6B9D'];
  for (let i = 0; i < 15; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 30 + Math.random() * 80;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.background = colors[i % colors.length];
    b.style.left = Math.random() * 100 + 'vw';
    b.style.animationDuration = (15 + Math.random() * 20) + 's';
    b.style.animationDelay = (Math.random() * 20) + 's';
    container.appendChild(b);
  }
}
createBubbles();

// ===== LEARN MODE =====
let currentDetailItem = null;

function initLearn() {
  const grid = document.getElementById('letter-grid');
  if (grid.children.length > 0) return; // already built
  ALPHABET.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'letter-card';
    card.style.setProperty('--i', i);
    card.style.borderTop = `5px solid ${item.color}`;
    card.innerHTML = `
      <div class="big-letter" style="color:${item.color}">${item.letter}</div>
      <span class="animal-emoji">${item.emoji}</span>
      <div class="animal-name">${item.animal}</div>
    `;
    card.onclick = () => openDetail(item);
    grid.appendChild(card);
  });
}

function openDetail(item) {
  currentDetailItem = item;
  document.getElementById('detail-letter').innerHTML =
    `${item.letter}<span class="lower">${item.letter.toLowerCase()}</span>`;
  document.getElementById('detail-letter').style.color = item.color;
  document.getElementById('detail-animal').textContent = item.emoji;
  document.getElementById('detail-name').textContent = item.animal;
  document.getElementById('detail-phrase').textContent = `"${item.letter} is for ${item.animal}!"`;
  document.getElementById('detail-overlay').classList.add('show');
  speakLetterAndAnimal(item);
}

function closeDetail(e) {
  if (e && e.target !== document.getElementById('detail-overlay')) return;
  document.getElementById('detail-overlay').classList.remove('show');
  speechSynthesis.cancel();
}

function speakCurrent() {
  if (currentDetailItem) speakLetterAndAnimal(currentDetailItem);
}

// ===== LISTEN MODE =====
let listenIndex = 0;
let listenPlaying = false;
let listenTimer = null;

function initListen() {
  listenIndex = 0;
  updateListenDisplay();
  buildProgressDots();
}

function buildProgressDots() {
  const container = document.getElementById('listen-progress');
  container.innerHTML = '';
  for (let i = 0; i < 26; i++) {
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    if (i < listenIndex) dot.classList.add('done');
    if (i === listenIndex) dot.classList.add('active');
    container.appendChild(dot);
  }
}

function updateListenDisplay() {
  const item = ALPHABET[listenIndex];
  const letterEl = document.getElementById('listen-letter');
  const animalEl = document.getElementById('listen-animal');
  const nameEl = document.getElementById('listen-name');

  letterEl.textContent = item.letter;
  letterEl.style.color = item.color;
  animalEl.textContent = item.emoji;
  nameEl.textContent = item.animal;

  // restart animations
  letterEl.style.animation = 'none';
  animalEl.style.animation = 'none';
  letterEl.offsetHeight;
  animalEl.offsetHeight;
  letterEl.style.animation = '';
  animalEl.style.animation = '';

  buildProgressDots();
}

function toggleListen() {
  listenPlaying = !listenPlaying;
  const btn = document.getElementById('play-pause-btn');
  btn.textContent = listenPlaying ? '⏸' : '▶';
  if (listenPlaying) {
    playListenStep();
  } else {
    clearTimeout(listenTimer);
  }
}

function playListenStep() {
  if (!listenPlaying) return;
  const item = ALPHABET[listenIndex];
  speakLetterAndAnimal(item);

  // Wait for speech to finish + a pause, then advance
  const checkDone = () => {
    if (!speechSynthesis.speaking && listenPlaying) {
      listenTimer = setTimeout(() => {
        listenIndex++;
        if (listenIndex >= 26) {
          listenIndex = 0; // loop
        }
        updateListenDisplay();
        playListenStep();
      }, 800);
    } else if (listenPlaying) {
      setTimeout(checkDone, 300);
    }
  };
  setTimeout(checkDone, 1000);
}

function stopListen() {
  listenPlaying = false;
  clearTimeout(listenTimer);
  speechSynthesis.cancel();
  document.getElementById('play-pause-btn').textContent = '▶';
}

function nextLetter() {
  listenIndex = (listenIndex + 1) % 26;
  updateListenDisplay();
  speakLetterAndAnimal(ALPHABET[listenIndex]);
}

function prevLetter() {
  listenIndex = (listenIndex - 1 + 26) % 26;
  updateListenDisplay();
  speakLetterAndAnimal(ALPHABET[listenIndex]);
}

// ===== GAME MODE =====
let gameRound = 0;
let gameScore = 0;
let gameQuestions = [];
const TOTAL_ROUNDS = 10;

function initGame() {
  gameRound = 0;
  gameScore = 0;
  document.getElementById('score').textContent = '0';
  generateQuestions();
  renderRound();
}

function generateQuestions() {
  const shuffled = [...ALPHABET].sort(() => Math.random() - 0.5);
  gameQuestions = shuffled.slice(0, TOTAL_ROUNDS);
}

function renderRound() {
  if (gameRound >= TOTAL_ROUNDS) {
    showGameFinished();
    return;
  }

  const item = gameQuestions[gameRound];
  const area = document.getElementById('game-area');

  // Generate 3 options: the correct one + 2 random
  const others = ALPHABET.filter(a => a.letter !== item.letter).sort(() => Math.random() - 0.5).slice(0, 2);
  const options = [...others, item].sort(() => Math.random() - 0.5);

  area.innerHTML = `
    <div class="game-prompt">Which letter does this animal start with?</div>
    <div class="game-animal">${item.emoji}</div>
    <div class="game-question">${item.animal}</div>
    <div class="game-options" id="game-options"></div>
    <div class="game-result" id="game-result"></div>
    <button class="next-btn" id="next-btn" onclick="nextRound()">Next ➡</button>
  `;

  const optsContainer = document.getElementById('game-options');
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt.letter;
    btn.style.borderTop = `5px solid ${opt.color}`;
    btn.onclick = () => handleAnswer(btn, opt, item);
    optsContainer.appendChild(btn);
  });

  // Speak the animal name
  speak(`What letter does ${item.animal} start with?`, 0.85, 1.2);
}

function handleAnswer(btn, chosen, correct) {
  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(b => b.disabled = true);

  if (chosen.letter === correct.letter) {
    btn.classList.add('correct');
    gameScore++;
    document.getElementById('score').textContent = gameScore;
    const result = document.getElementById('game-result');
    result.textContent = '🎉 Correct! ' + correct.letter + ' is for ' + correct.animal + '!';
    result.style.color = '#6BCB77';
    result.classList.add('show');
    celebrate();
    speak(`Yes! ${correct.letter} is for ${correct.animal}!`, 0.9, 1.3);
  } else {
    btn.classList.add('wrong');
    // highlight correct
    allBtns.forEach(b => {
      if (b.textContent === correct.letter) b.classList.add('correct');
    });
    const result = document.getElementById('game-result');
    result.textContent = 'Oops! ' + correct.letter + ' is for ' + correct.animal + '.';
    result.style.color = '#FF6B6B';
    result.classList.add('show');
    speak(`Oops! ${correct.letter} is for ${correct.animal}.`, 0.85, 1.1);
  }

  document.getElementById('next-btn').classList.add('show');
}

function nextRound() {
  gameRound++;
  renderRound();
}

function celebrate() {
  const container = document.getElementById('star-celebration');
  container.innerHTML = '';
  const emojis = ['⭐','✨','🌟','💫','🎉'];
  for (let i = 0; i < 12; i++) {
    const star = document.createElement('div');
    star.className = 'star-particle';
    star.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    star.style.left = (40 + Math.random() * 20) + 'vw';
    star.style.top = (40 + Math.random() * 20) + 'vh';
    star.style.setProperty('--dx', (Math.random() * 400 - 200) + 'px');
    star.style.setProperty('--dy', (Math.random() * 200 - 100) + 'px');
    star.style.animationDelay = (Math.random() * 0.3) + 's';
    container.appendChild(star);
  }
  setTimeout(() => { container.innerHTML = ''; }, 1500);
}

function showGameFinished() {
  document.getElementById('final-score').textContent = `${gameScore} / ${TOTAL_ROUNDS}`;
  document.getElementById('game-finished').classList.add('show');
  speak(`Great job! You got ${gameScore} out of ${TOTAL_ROUNDS}!`, 0.9, 1.3);
}

function restartGame() {
  document.getElementById('game-finished').classList.remove('show');
  initGame();
}

function endGame() {
  document.getElementById('game-finished').classList.remove('show');
  speechSynthesis.cancel();
}

// ===== Keyboard support =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('detail-overlay').classList.contains('show')) {
      closeDetail();
    }
  }
});
</script>
